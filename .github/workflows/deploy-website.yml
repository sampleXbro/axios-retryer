# Deploy the Astro docs site to GitHub Pages (project site: /axios-retryer).
# Repository Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'sandbox/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
            sandbox/package-lock.json
      - name: Build library (sandbox depends on dist)
        run: npm ci && npm run build
      - name: Install and build website (embeds sandbox)
        env:
          SANDBOX_SKIP_LIB_BUILD: '1'
        run: npm ci && npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
