# CI on pushes and PRs; npm publish via OIDC trusted publishing (no NPM_TOKEN).
# Configure the package on https://www.npmjs.com → Package settings → Trusted publishers:
#   GitHub Actions → owner/repo → workflow filename: publish.yml
#
# Requires: Node ≥ 22.14, npm CLI ≥ 11.5.1 (see https://docs.npmjs.com/trusted-publishers )

name: CI and npm publish

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ci:
    name: CI (tests)
    runs-on: ubuntu-latest
    if: github.event_name != 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sampleXbro/axios-retryer

  publish:
    name: Publish to npm (OIDC)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.target_commitish == 'main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Do not run `npm install -g npm@…` here: the runner’s preinstalled npm can be
      # broken (MODULE_NOT_FOUND: promise-retry in @npmcli/arborist). Bootstrap by
      # fetching the npm tarball (which ships with bundled node_modules) into /tmp,
      # then invoking npm-cli.js with bare node to install from the local tarball —
      # no second registry round-trip and no workspace pollution.
      - name: Ensure npm ≥ 11.5.1 for OIDC publishing
        run: |
          set -euo pipefail
          NPM_VER=11.5.2
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VER}.tgz" -o /tmp/npm-bootstrap.tgz
          tar xzf /tmp/npm-bootstrap.tgz -C /tmp
          node /tmp/package/bin/npm-cli.js install -g /tmp/npm-bootstrap.tgz
          rm -rf /tmp/npm-bootstrap.tgz /tmp/package
          hash -r || true
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        # OIDC: no NODE_AUTH_TOKEN. Provenance is attached automatically for public repos.
        run: npm publish --access public
