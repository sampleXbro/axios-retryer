# CI on pushes and PRs; npm publish via OIDC trusted publishing (no NPM_TOKEN).
# Configure the package on https://www.npmjs.com → Package settings → Trusted publishers:
#   GitHub Actions → owner/repo → workflow filename: publish.yml
#
# Requires: Node ≥ 22.14, npm CLI ≥ 11.5.1 (see https://docs.npmjs.com/trusted-publishers )

name: CI and npm publish

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ci:
    name: CI (tests)
    runs-on: ubuntu-latest
    if: github.event_name != 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sampleXbro/axios-retryer

  publish:
    name: Publish to npm (OIDC)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.target_commitish == 'main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Global self-upgrade (`npm i -g npm`) can fail on hosted runners when the cached
      # npm install is incomplete (e.g. MODULE_NOT_FOUND: promise-retry). Bootstrap from
      # the registry tarball using Node only, then install globally.
      - name: Ensure npm supports trusted publishing
        env:
          NPM_BOOTSTRAP_VERSION: '11.5.2'
        run: |
          set -euo pipefail
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_BOOTSTRAP_VERSION}.tgz" -o npm-bootstrap.tgz
          tar xf npm-bootstrap.tgz
          node package/bin/npm-cli.js install -g ./package
          rm -rf npm-bootstrap.tgz package
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        # OIDC: no NODE_AUTH_TOKEN. Provenance is attached automatically for public repos.
        run: npm publish --access public
